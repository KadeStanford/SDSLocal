name: Readiness evidence
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run source checks and generate report
        run: node scripts/readiness.mjs
      - name: Upload results even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parish-pass-readiness-${{ github.sha }}
          path: reports/readiness/
          if-no-files-found: warn
          retention-days: 14
