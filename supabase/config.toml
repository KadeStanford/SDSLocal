project_id = "sds-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**", "sdslocal://**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 900

[auth.email.template.recovery]
subject = "Your SDS Local password reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your SDS Local sign-in code"
content_path = "./supabase/templates/magic-link.html"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.finalize-business-image]
verify_jwt = true

[functions.loyalty-token]
verify_jwt = true

[functions.loyalty-transact]
verify_jwt = true

[functions.notification-dispatch]
verify_jwt = true

[analytics]
enabled = false
