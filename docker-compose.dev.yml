name: sds-local-dev

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ['pnpm', '--filter', '@sds/web', 'exec', 'next', 'dev', '--hostname', '0.0.0.0']
    working_dir: /workspace
    env_file:
      - ./apps/web/.env.local
    environment:
      # Invite links and auth callbacks must be reachable from the phone.
      # The launcher supplies the active LAN address; never advertise loopback.
      NEXT_PUBLIC_SITE_URL: http://${EXPO_HOST_IP:?EXPO_HOST_IP must be set to the host LAN address}:3000
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - sds_node_modules:/workspace/node_modules
      - sds_web_node_modules:/workspace/apps/web/node_modules
    networks:
      - supabase
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/auth').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  mobile:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command:
      [
        'pnpm',
        '--filter',
        '@sds/mobile',
        'exec',
        'expo',
        'start',
        '--dev-client',
        '--lan',
        '--port',
        '8081',
      ]
    working_dir: /workspace
    env_file:
      - ./apps/mobile/.env.local
    environment:
      # A phone cannot resolve the host's localhost. The launcher supplies the
      # active LAN address; fail loudly if someone starts Compose directly
      # without it instead of silently advertising an unusable URL.
      EXPO_PUBLIC_SITE_URL: http://${EXPO_HOST_IP:?EXPO_HOST_IP must be set to the host LAN address}:3000
      EXPO_PACKAGER_PROXY_URL: http://${EXPO_HOST_IP:?EXPO_HOST_IP must be set to the host LAN address}:8081
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST_IP:?EXPO_HOST_IP must be set to the host LAN address}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - '8081:8081'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    volumes:
      - sds_node_modules:/workspace/node_modules
      - sds_mobile_node_modules:/workspace/apps/mobile/node_modules
    # Windows Docker bind mounts do not reliably forward the inotify events
    # Metro uses for Fast Refresh. Compose Watch syncs source files into the
    # image-backed workspace instead, where Metro receives normal filesystem
    # events without sharing host node_modules.
    develop:
      watch:
        - action: sync
          path: ./apps/mobile/src
          target: /workspace/apps/mobile/src
          initial_sync: true
        - action: sync
          path: ./apps/mobile/assets
          target: /workspace/apps/mobile/assets
          initial_sync: true
        - action: sync
          path: ./packages/api-client/src
          target: /workspace/packages/api-client/src
          initial_sync: true
        - action: sync
          path: ./packages/business-logic/src
          target: /workspace/packages/business-logic/src
          initial_sync: true
        - action: sync
          path: ./packages/design-tokens/src
          target: /workspace/packages/design-tokens/src
          initial_sync: true
        - action: sync
          path: ./packages/image-processing-config/src
          target: /workspace/packages/image-processing-config/src
          initial_sync: true
        - action: sync
          path: ./packages/types/src
          target: /workspace/packages/types/src
          initial_sync: true
        - action: sync
          path: ./packages/validation/src
          target: /workspace/packages/validation/src
          initial_sync: true
        - action: sync+restart
          path: ./apps/mobile/app.config.ts
          target: /workspace/apps/mobile/app.config.ts
        - action: rebuild
          path: ./apps/mobile/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
    networks:
      - supabase
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  supabase:
    external: true
    name: supabase_network_sds-local

volumes:
  sds_node_modules:
  sds_web_node_modules:
  sds_mobile_node_modules:
