packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  dtrace-provider: false
  protobufjs: false
  sharp: true
  unrs-resolver: false

overrides:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@expo/cli'
  - '@expo/router-server'
  - 'babel-preset-expo'
  - 'expo'
  - 'expo-notifications'
  - 'next'
